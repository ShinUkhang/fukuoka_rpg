<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>후쿠오카 RPG — 규슈국제대학 부속고등학교</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:#0e1c0e;
         display:flex; justify-content:center; align-items:flex-start; min-height:100vh; color:#fff; }
  #wrap { width:100%; max-width:980px; padding:8px; }
  #hud { display:flex; align-items:center; gap:8px; background:#1e3a1a; border:3px solid #0a1408;
         border-radius:10px; padding:8px 12px; margin-bottom:8px; flex-wrap:wrap; box-shadow:4px 4px 0 #0a1408; }
  #hud .stat { font-weight:800; font-size:14px; background:#0f200c; border:2px solid #2c5a24;
               border-radius:8px; padding:6px 10px; color:#ffe9a3; }
  #hud .stat b { color:#7CFC00; }
  #hud .next { font-size:12px; color:#cfe8c0; font-weight:700; }
  #langbox { margin-left:auto; display:flex; gap:6px; }
  #langbox button { border:2px solid #2c5a24; background:#0f200c; color:#cfe8c0; border-radius:8px;
                    padding:6px 12px; font-weight:700; font-size:13px; cursor:pointer; }
  #langbox button.on { background:#7CFC00; color:#0f200c; border-color:#7CFC00; }
  #stage { position:relative; border:4px solid #0a1408; border-radius:10px; overflow:hidden;
           box-shadow:4px 4px 0 #0a1408; background:#000; }
  canvas { display:block; width:100%; height:auto; touch-action:none; image-rendering:pixelated;
           image-rendering:crisp-edges; }
  #dlg { position:absolute; left:10px; right:10px; bottom:10px; background:#fff8e7; color:#222;
         border:4px solid #111; border-radius:6px; box-shadow:4px 4px 0 #000; padding:12px 14px;
         font-size:15px; font-weight:600; line-height:1.6; display:none; z-index:6; }
  #dlg .nm { display:inline-block; background:#2f6fed; color:#fff; font-weight:900; font-size:12px;
             border-radius:4px; padding:2px 8px; margin-bottom:6px; }
  #dlg .more { text-align:right; color:#888; font-size:12px; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  #pad { position:absolute; inset:auto 0 0 0; display:none; justify-content:space-between;
         padding:0 12px 12px; pointer-events:none; z-index:7; }
  @media (pointer:coarse) { #pad { display:flex; } #dlg { bottom:96px; } }
  #pad .grp { display:flex; gap:10px; pointer-events:auto; }
  #pad button { width:60px; height:60px; border-radius:12px; border:3px solid #0a1408;
                background:rgba(255,255,255,.88); font-size:22px; font-weight:900; color:#123;
                box-shadow:3px 3px 0 #0a1408; touch-action:none; }
  #pad button:active { background:#7CFC00; transform:translate(2px,2px); box-shadow:1px 1px 0 #0a1408; }
  #pad button.abtn { background:rgba(255,120,120,.94); border-radius:50%; width:70px; height:70px; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
             background:rgba(10,20,8,.78); z-index:10; padding:10px; }
  #overlay.hidden { display:none; }
  #fx { position:fixed; inset:0; width:100vw; height:100vh; z-index:60; pointer-events:none; display:none; }
  .card { position:relative; z-index:2; }
  .card { background:#fff8e7; color:#222; border:4px solid #111; border-radius:6px; padding:22px;
          width:min(94%,540px); max-height:94%; overflow-y:auto; text-align:center;
          box-shadow:6px 6px 0 #000; }
  .card h1 { font-size:21px; margin-bottom:8px; }
  .card h2 { font-size:18px; margin-bottom:8px; }
  .card p { font-size:14px; color:#444; line-height:1.7; margin-bottom:10px; }
  .story { text-align:left; background:#f3ecd9; border:2px solid #b9a86a; border-radius:6px;
           padding:10px 12px; margin-bottom:10px; font-size:13.5px; color:#4a3f22; line-height:1.7; }
  .pxbtn { display:block; width:100%; border:3px solid #111; border-radius:6px; padding:13px;
           font-size:16px; font-weight:900; background:#2f9e44; color:#fff; cursor:pointer;
           margin-top:10px; box-shadow:4px 4px 0 #111; font-family:inherit; }
  .pxbtn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 #111; }
  .pxbtn.gray { background:#e5e8eb; color:#333; }
  .pxbtn.blue { background:#2f6fed; }
  .opts button { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
                 border:3px solid #111; background:#fff; border-radius:6px; padding:10px 12px;
                 font-size:15px; font-weight:700; margin-bottom:8px; cursor:pointer;
                 box-shadow:3px 3px 0 #111; font-family:inherit; }
  .opts button:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #111; }
  .opts button.right { background:#d3f9d8; }
  .opts button.wrong { background:#ffd6d6; }
  .abc { flex:0 0 28px; height:28px; border-radius:50%; background:#111; color:#fff; font-weight:900;
         display:flex; align-items:center; justify-content:center; font-size:13px; }
  .qword { font-size:44px; font-weight:900; margin:6px 0 12px; color:#111; }
  .qpic { max-width:100%; border:3px solid #111; border-radius:4px; margin:6px 0; }
  .qqpic { max-width:100%; max-height:230px; border:3px solid #111; border-radius:4px; margin:6px 0; }
  .qprompt { font-weight:700; margin:4px 0; }
  .snackbig { font-size:32px; font-weight:900; margin:8px 0; }
  .qcap { font-weight:800; font-size:14px; color:#333; margin-bottom:4px; }
  #board { text-align:left; margin:6px 0 4px; }
  #board .row { display:flex; gap:8px; padding:7px 10px; border-radius:6px; font-size:14px;
                font-weight:600; border:2px solid transparent; }
  #board .row:nth-child(odd) { background:#f1ead6; }
  #board .row.me { background:#fff0a8; border-color:#111; }
  #board .rank { width:30px; font-weight:900; color:#2f9e44; }
  #board .nm2 { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #board .sc { font-weight:900; }
  #nameinput { width:100%; border:3px solid #111; border-radius:6px; padding:11px; font-size:16px;
               margin:8px 0; font-family:inherit; }
  .tier { font-size:54px; font-weight:900; color:#2f9e44; margin:4px 0; text-shadow:3px 3px 0 #111; }
  .scoreline { font-size:14px; color:#444; margin-bottom:4px; }
  .scoreline b { color:#111; }
  .aireveal { background:#e7f0ff; border:3px dashed #2f6fed; border-radius:6px; padding:10px;
              font-weight:900; color:#1c3fd6; margin:12px 0 4px; font-size:14px; }
  #mfb { min-height:24px; font-weight:900; font-size:14px; margin-top:4px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat">⏱ <b id="h-time">0:00</b></div>
    <div class="stat">⭐ <b id="h-score">0</b></div>
    <div class="stat">📜 <b id="h-q">0/4</b></div>
    <div class="next" id="h-next"></div>
    <div id="langbox">
      <button data-l="ko" class="on">한국어</button>
      <button data-l="ja">日本語</button>
      <button data-l="en">English</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>
    <div id="dlg"><div class="nm" id="dlg-nm"></div><div id="dlg-tx"></div><div class="more">▼</div></div>
    <div id="pad">
      <div class="grp">
        <button id="bU">▲</button><button id="bL">◀</button><button id="bR">▶</button><button id="bD">▼</button>
      </div>
      <div class="grp"><button id="bA" class="abtn">A</button></div>
    </div>
    <div id="overlay"><canvas id="fx"></canvas><div class="card" id="card"></div></div>
  </div>
</div>

/* ================= utils ================= */
const $=id=>document.getElementById(id);
const cv=$("game"), ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=false;
function fmt(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function rnd(n){ return ((((n*9301+49297)%233280)+233280)%233280)/233280; }
function R(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function grade(s){ return s>=600?"S":s>=480?"A":s>=360?"B":"C"; }

/* ================= sound ================= */
let AC=null;
function beep(f,d,type,v){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"square"; o.frequency.value=f; g.gain.value=v||0.035;
    o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.stop(AC.currentTime+d);
  }catch(e){}
}

/* ================= map ================= */
const TW=16, MW=64, MH=44;
const grid=[]; // tile type
const solids=[]; // {x,y,w,h} pixel
function tile(x,y){ return (x<0||y<0||x>=MW||y>=MH)?9:grid[y][x]; }
function addSolid(tx,ty,tw,th){ solids.push({x:tx*TW,y:ty*TW,w:tw*TW,h:th*TW}); }
function carvePath(x0,x1,y,v){ for(let x=x0;x<=x1;x++){ grid[y][x]=v; } }
function buildMap(){
  for(let y=0;y<MH;y++){ grid[y]=[]; for(let x=0;x<MW;x++) grid[y][x]=0; } // 0 grass
  const rect=(x0,x1,y0,y1,v)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) grid[y][x]=v; };
  rect(42,50,36,40,2);   // hakata station plaza (stone)
  rect(54,62,34,40,3);   // dazaifu shrine grounds (sand)
  rect(8,20,14,24,3);    // kokura castle grounds (sand)
  rect(48,58,15,23,2);   // mojiko retro plaza (stone)
  for(let x=10;x<=62;x++) grid[38][x]=1;              // east-west street: hakata <-> dazaifu/yatai
  for(let y=14;y<=38;y++) for(let x=49;x<=51;x++) grid[y][x]=1; // north road
  for(let x=8;x<=49;x++) grid[20][x]=1;               // west branch -> kokura castle
  for(let x=51;x<=58;x++) grid[20][x]=1;             // east branch -> mojiko retro
  for(let x=14;x<=49;x++){ grid[13][x]=1; grid[14][x]=1; } // school road
  // water: kokura castle moat (gap at 14,14 = bridge where road crosses) + nakasu riverside
  for(let x=9;x<=13;x++) grid[14][x]=5;
  for(let x=9;x<=14;x++) grid[19][x]=5;
  for(let y=15;y<=18;y++){ grid[y][9]=5; grid[y][14]=5; }
  for(let x=12;x<=32;x++) grid[35][x]=5;
  // trees (avoid paths/grounds/rects)
  const avoid=(x,y)=>{
    if(grid[y][x]===1||grid[y][x]===2||grid[y][x]===3||grid[y][x]===5) return true;
    if(x>=24&&x<=36&&y>=8&&y<=13) return true;   // school
    if(x>=42&&x<=50&&y>=36&&y<=40) return true;  // hakata plaza
    if(x>=54&&x<=62&&y>=34&&y<=40) return true;  // dazaifu
    if(x>=8&&x<=20&&y>=14&&y<=24) return true;   // kokura
    if(x>=48&&x<=58&&y>=15&&y<=23) return true;  // mojiko
    if(x>=14&&x<=32&&y>=36&&y<=37) return true;  // yatai stalls
    return false;
  };
  trees.length=0; flowers.length=0;
  for(let i=0;i<900;i++){
    const x=Math.floor(rnd(i*7+1)*MW), y=Math.floor(rnd(i*13+5)*MH);
    if(avoid(x,y)) continue;
    if(rnd(i*5+3)<0.10) trees.push({x,y});
    else if(rnd(i*11+7)<0.05) flowers.push({x,y,c:rnd(i*17+9)<0.5?"#ff7eb9":"#ffd93d"});
  }
  // solids
  solids.length=0;
  addSolid(42,36,7,2);   // hakata station
  addSolid(57,34,4,3);   // dazaifu shrine
  addSolid(10,15,4,4);   // kokura castle
  addSolid(50,15,6,3);   // mojiko retro station
  for(const st of stalls) addSolid(st.x,st.y,2,2); // yatai stalls
  addSolid(24,8,13,5);   // school
  for(let x=9;x<=13;x++) addSolid(x,14,1,1);   // moat top
  for(let x=9;x<=14;x++) addSolid(x,19,1,1);   // moat bottom
  for(let y=15;y<=18;y++){ addSolid(9,y,1,1); addSolid(14,y,1,1); } // moat sides
  addSolid(12,35,21,1);  // nakasu river
  for(const d of DECORDEF) addSolid(d.x,d.y+0.35,1,0.65); // decor figures
  for(const tr of trees) addSolid(tr.x,tr.y+0.35,1,0.65);
}
const trees=[], flowers=[];
const stalls=[{x:14,y:36},{x:17,y:36},{x:20,y:36},{x:23,y:36},{x:26,y:36},{x:29,y:36}];
// npc positions (tile)
const NPCPOS=[{x:59,y:37},{x:22,y:38},{x:14,y:21},{x:54,y:21},{x:20,y:14},{x:32,y:15}];
// decorative figures (no interaction): station staff, castle daimyo, shrine worshipper
const DECORDEF=[{x:44,y:38,kind:"staff"},{x:52,y:18,kind:"staff"},{x:11,y:21,kind:"daimyo"},{x:58,y:38,kind:"pray"}];
buildMap();

/* ================= tile & object drawing ================= */
function drawTile(x,y,px,py){
  const v=grid[y][x], h=(x*37+y*91)%7;
  if(v===0){ R(px,py,16,16,h%2?"#3f8f3f":"#3a863a"); if(h>4) R(px+4+(h%3),py+6,2,2,"#2f702f"); }
  else if(v===1){ R(px,py,16,16,"#b98d55"); R(px,py,16,3,"#a67c48"); if(h>3) R(px+3+(h%4),py+8,3,2,"#8f6b3d"); }
  else if(v===2){ R(px,py,16,16,h%2?"#9aa0a8":"#9399a1"); R(px,py,16,1,"#7c828a"); R(px+8,py,1,16,"#7c828a"); }
  else if(v===3){ R(px,py,16,16,"#d9c48a"); if(h>4) R(px+5,py+9,3,2,"#c2ab6f"); }
  else if(v===4){ R(px,py,16,16,"#7d8a7d"); if(h>3) R(px+4+(h%3),py+7,4,3,"#5f6b5f"); }
  else if(v===5){ // water

/* ================= interaction ================= */
function rectHit(x,y,w,h){
  for(const s of solids){ if(x<s.x+s.w&&x+w>s.x&&y<s.y+s.h&&y+h>s.y) return true; }
  for(const n of npcs){ if(x<n.x-6+12&&x+w>n.x-6&&y<n.y-4+18&&y+h>n.y-4) return true; }
  return false;
}
function tryMove(dx,dy){
  const sp=1.7;
  if(dx&&!rectHit(player.x-5+dx*sp,player.y+2,10,12)) player.x+=dx*sp;
  if(dy&&!rectHit(player.x-5,player.y+2+dy*sp,10,12)) player.y+=dy*sp;
  player.x=Math.max(8,Math.min(MW*TW-8,player.x));
  player.y=Math.max(8,Math.min(MH*TW-8,player.y));
  if(dx) player.dir=dx<0?2:3; else if(dy) player.dir=dy<0?1:0;
  player.moving=!!(dx||dy);
}
function nearNPC(){
  let best=null,bd=34;
  for(const n of npcs){ const d=Math.hypot(n.x-player.x,n.y-player.y); if(d<bd){ bd=d; best=n; } }
  return best;
}
function facePlayer(n){ n.dir = Math.abs(n.x-player.x)>Math.abs(n.y-player.y)?(n.x>player.x?2:3):(n.y>player.y?0:1); }

/* ---- dialogue engine ---- */
function startTalk(n){
  facePlayer(n);
  const idx=npcs.indexOf(n);
  const nd=t().npcs[idx];
  state="talk";
  if(n.quest!==undefined&&!qdone[n.quest]){
    dlgState={npc:n, lines:nd.lines.slice(), qi:n.quest, idx, phase:"lines", li:0};
  } else if(n.quest!==undefined&&qdone[n.quest]){
    dlgState={npc:n, lines:[nd.done], idx, phase:"lines", li:0};
  } else if(n.snack&&snackDone){
    dlgState={npc:n, lines:[t().snackDone], idx, phase:"lines", li:0};
  } else {
    dlgState={npc:n, lines:nd.lines.slice(), idx, phase:"lines", li:0, snack:!!n.snack};
  }
  showLine();
}
function showLine(){
  const nd=t().npcs[dlgState.idx];
  $("dlg-nm").textContent=nd.name;
  const full=dlgState.lines[dlgState.li];
  $("dlg").style.display="block";
  $("dlg-tx").textContent="";
  clearInterval(typeTimer); sTalk();
  let i=0;
  typeTimer=setInterval(()=>{
    i++; $("dlg-tx").textContent=full.slice(0,i);
    if(i>=full.length){ clearInterval(typeTimer); dlgState.typing=false; }
  },28);
  dlgState.full=full; dlgState.typing=true;
}
function advanceDlg(){
  if(dlgState.typing){ clearInterval(typeTimer); $("dlg-tx").textContent=dlgState.full; dlgState.typing=false; return; }
  sTalk();
  dlgState.li++;
  if(dlgState.li<dlgState.lines.length){ showLine(); return; }
  if(dlgState.phase==="lines"&&dlgState.qi!==undefined&&!qdone[dlgState.qi]){
    openQuiz(dlgState.qi);
  } else if(dlgState.phase==="lines"&&dlgState.snack&&!snackDone){
    openSnack();
  } else { endTalk(); }
}
function endTalk(){ clearInterval(typeTimer); $("dlg").style.display="none"; dlgState=null; state="play"; }

function openQuiz(qi){
  state="quiz";
  const q=t().quiz[qi];
  const order=shuffle(q.o.map((_,i)=>i));
  let html=`<h2>🧭 ${t().qtitle}</h2><div class="qprompt">${t().qpic}</div><img class="qqpic" src="${q.img}" alt="photo"><div class="opts">`;
  order.forEach((oi,k)=>{ html+=`<button data-oi="${oi}"><span class="abc">${"ABC"[k]}</span>${esc(q.o[oi])}</button>`; });
  html+=`</div><div id="mfb"></div>`;
  $("card").innerHTML=html; $("overlay").classList.remove("hidden");
  $("card").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi;
    if(oi===q.a){
      b.classList.add("right"); sGood();
      const pts=[100,60,30][Math.min(qatt[qi],2)];
      qpts+=pts; score+=pts; qdone[qi]=true;
      setTimeout(()=>showPhoto(qi),650);
    } else {
      b.classList.add("wrong"); b.disabled=true; sBad();
      qatt[qi]++;
      $("mfb").textContent=t().wrong; $("mfb").style.color="#d33";
    }
    updateHUD();
  });
}

    <div class="tier">${grade_}</div>
    <div class="scoreline">${t().qpts}: <b>${qpts}</b> · ${t().tbonus}: <b>${bonus}</b></div>
    <div class="scoreline">${t().yourscore}: <b style="font-size:20px">${score}</b> ${t().pts} · ⏱ ${fmt(elapsed)} · 📜 ${n}/4</div>
    <div class="aireveal">${t().aireveal}</div>
    <input id="nameinput" maxlength="12" placeholder="${t().entername}">
    <button class="pxbtn" id="bsave">${t().save}</button>
    <button class="pxbtn gray" id="bshare">${t().share}</button>
    <button class="pxbtn blue" id="bagain">${t().again}</button>
    <h2 style="margin-top:12px">${t().board}</h2>${boardHTML()}`;
  $("overlay").classList.remove("hidden");
  $("bsave").onclick=()=>{
    const n=($("nameinput").value||"").trim()||"???";
    const b=loadBoard(); b.push({n,s:score,tm:Math.floor(elapsed),me:true});
    b.sort((a,b2)=>b2.s-a.s); saveBoard(b);
    $("bsave").disabled=true; $("bsave").textContent="✔ "+t().save;
    $("card").querySelector("h2:last-of-type").outerHTML=`<h2 style="margin-top:12px">${t().board}</h2>${boardHTML()}`;
  };
  $("bshare").onclick=()=>{
    const txt=t().sharetext(score,grade_,fmt(elapsed),qdone.filter(Boolean).length);
    if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); }
    else { navigator.clipboard.writeText(txt).then(()=>{ $("bshare").textContent=t().copied; }).catch(()=>{}); }
  };
  $("bagain").onclick=()=>showMenu();
}

/* ================= clear celebration: students + fireworks + poppers ================= */
let fxRAF=null, fxSized=false;
function startCelebration(){
  const cv=$("fx"); if(!cv) return;
  const g=cv.getContext("2d");
  const size=()=>{ cv.width=innerWidth; cv.height=innerHeight; };
  size();
  if(!fxSized){ fxSized=true; addEventListener("resize",()=>{ if(state==="over") size(); }); }
  cv.style.display="block";
  const cols=["#ffd93d","#ff6b9d","#4dd8ff","#7dff6b","#ff8c42","#c77dff","#ffffff"];
  const FW=[],PT=[],CF=[],ST=[];
  for(let i=0;i<16;i++){
    ST.push({x:innerWidth/2+(Math.random()-0.5)*80, y:innerHeight+30, delay:0.2+i*0.13,
      tx:innerWidth/2+(Math.random()-0.5)*Math.min(640,innerWidth-140),
      c:["#1f3a6e","#2b4a8a","#3a5a9e","#16294f"][i%4], ph:Math.random()*6.28, rib:i%3===0});
  }
  const pops=[{t:0.6},{t:1.8}];
  let last=performance.now();
  const R2=(x,y,w,hh,c)=>{ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(hh)); };
  function student(s,ts){
    const jy=Math.abs(Math.sin(ts/280+s.ph))*7, x=s.x, y=s.y-jy;
    g.fillStyle="rgba(0,0,0,.25)"; g.fillRect(x-7,y+17,14,3);
    R2(x-5,y+13,4,5,"#2b2b2b"); R2(x+1,y+13,4,5,"#2b2b2b");
    R2(x-7,y+5,14,9,s.c); R2(x-7,y+5,14,2,"#0f1f3d");
    R2(x-2,y+6,4,6,"#f8f4e6");
    if(s.rib) R2(x-2,y+7,4,2,"#c2255c");
    const wv=Math.sin(ts/160+s.ph)*4;
    R2(x-10,y+wv,3,7,s.c); R2(x+7,y+wv,3,7,s.c);
    R2(x-10,y-2+wv,3,3,"#f2c89b"); R2(x+7,y-2+wv,3,3,"#f2c89b");
    R2(x-6,y-4,12,9,"#f2c89b");
    R2(x-3,y-1,2,2,"#222"); R2(x+1,y-1,2,2,"#222");
    R2(x-7,y-7,14,4,"#20242c"); R2(x-7,y-7,2,8,"#20242c"); R2(x+5,y-7,2,8,"#20242c");
  }
  function frame(ts){
    if(state!=="over"){ fxRAF=null; cv.style.display="none"; return; }
    const dt=Math.min(0.05,(ts-last)/1000); last=ts;
    const W=cv.width,H=cv.height;
    g.clearRect(0,0,W,H);
    /* fireworks */
    if(Math.random()<0.08&&FW.length<5)
      FW.push({x:W*0.08+Math.random()*W*0.84,y:H+6,vy:-(H*0.55+Math.random()*140),c:cols[(Math.random()*cols.length)|0]});
    for(let i=FW.length-1;i>=0;i--){ const r=FW[i];
      r.y+=r.vy*dt; r.vy+=70*dt;
      R2(r.x-1,r.y-5,3,9,r.c); R2(r.x-1,r.y+4,3,3,"#ffffff");
      if(r.vy>-50||r.y<H*0.42){
        for(let k=0;k<30;k++){ const a=k/30*6.283+Math.random()*0.2, sp=70+Math.random()*130;
          PT.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c:r.c}); }
        try{ beep(150+Math.random()*120,0.1,"triangle",0.022); }catch(e){}
        FW.splice(i,1);
      }
    }
    for(let i=PT.length-1;i>=0;i--){ const p=PT[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=170*dt; p.l-=dt*0.85;
      if(p.l<=0){ PT.splice(i,1); continue; }
      g.globalAlpha=Math.max(0,Math.min(1,p.l));
      R2(p.x-2,p.y-2,4,4,p.c);
      g.globalAlpha=1;
    }
    /* confetti rain */
    if(Math.random()<0.5)
      CF.push({x:Math.random()*W,y:-8,vx:(Math.random()-0.5)*30,vy:60+Math.random()*80,
        w:3+Math.random()*3,hh:2+Math.random()*3,c:cols[(Math.random()*cols.length)|0],ph:Math.random()*6.28});
    /* party poppers (bottom corners) */
    const py=H-26;
    [{x:46,dir:1},{x:W-46,dir:-1}].forEach((d,di)=>{
      g.save(); g.translate(d.x,py); g.scale(d.dir,1); g.rotate(-0.5);
      R2(-4,-16,8,16,"#c2255c"); R2(-4,-16,8,4,"#ffd93d"); R2(-2,-21,4,5,"#ffd93d");
      g.restore();
      pops[di].t-=dt;
      if(pops[di].t<=0){
        pops[di].t=2.4+Math.random()*1.6;
        for(let k=0;k<26;k++)
          CF.push({x:d.x,y:py-20,vx:d.dir*(60+Math.random()*170)+(Math.random()-0.5)*60,
            vy:-(220+Math.random()*200),w:3+Math.random()*3,hh:2+Math.random()*3,
            c:cols[(Math.random()*cols.length)|0],ph:Math.random()*6.28});
        try{ beep(520+Math.random()*180,0.07,"square",0.028); }catch(e){}
      }
    });
    for(let i=CF.length-1;i>=0;i--){ const c=CF[i];
      c.ph+=dt*8; c.x+=(c.vx+Math.sin(c.ph)*30)*dt; c.y+=c.vy*dt; c.vy=Math.min(c.vy+140*dt,170);
      if(c.y>H+12){ CF.splice(i,1); continue; }
      const fl=Math.sin(c.ph)>0;
      R2(c.x,c.y,fl?c.w:c.hh,fl?c.hh:c.w,c.c);
    }
    /* students pour out */
    for(const s of ST){
      if(s.delay>0){ s.delay-=dt; continue; }
      if(s.y>H-70) s.y-=150*dt;
      s.x+=(s.tx-s.x)*Math.min(1,dt*2);
      student(s,ts);
    }
    fxRAF=requestAnimationFrame(frame);
  }
  if(fxRAF) cancelAnimationFrame(fxRAF);
  fxRAF=requestAnimationFrame(frame);
}
/* ================= input ================= */
const keys={};
addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()]=true;
  if(state==="talk"&&(e.key===" "||e.key.toLowerCase()==="z"||e.key==="Enter")) advanceDlg();
  else if(state==="play"&&(e.key===" "||e.key.toLowerCase()==="z"||e.key==="Enter")){
    const n=nearNPC(); if(n) startTalk(n);
  }
});
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });
function bindHold(id,down,up){
  const el=$(id);
  const on=e=>{ e.preventDefault(); down(); }, off=e=>{ e.preventDefault(); up(); };
  el.addEventListener("pointerdown",on); el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off); el.addEventListener("pointerleave",off);
}
bindHold("bU",()=>keys["arrowup"]=true,()=>keys["arrowup"]=false);
bindHold("bD",()=>keys["arrowdown"]=true,()=>keys["arrowdown"]=false);
bindHold("bL",()=>keys["arrowleft"]=true,()=>keys["arrowleft"]=false);
bindHold("bR",()=>keys["arrowright"]=true,()=>keys["arrowright"]=false);
bindHold("bA",()=>{
  if(state==="talk") advanceDlg();
  else if(state==="play"){ const n=nearNPC(); if(n) startTalk(n); }
},()=>{});
document.querySelectorAll("#langbox button").forEach(b=>b.onclick=()=>{
  LANG=b.dataset.l;
  document.querySelectorAll("#langbox button").forEach(x=>x.classList.toggle("on",x===b));
  if(state==="menu") showMenu(); updateHUD();
});

/* ================= render ================= */
function render(){
  ctx.fillStyle="#0e1c0e"; ctx.fillRect(0,0,480,270);
  cam.x=Math.max(0,Math.min(MW*TW-480,player.x-240));
  cam.y=Math.max(0,Math.min(MH*TW-270,player.y-135));
  const ox=Math.round(-cam.x), oy=Math.round(-cam.y);
  const x0=Math.max(0,Math.floor(cam.x/TW)), x1=Math.min(MW-1,Math.ceil((cam.x+480)/TW));
  const y0=Math.max(0,Math.floor(cam.y/TW)), y1=Math.min(MH-1,Math.ceil((cam.y+270)/TW));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) drawTile(x,y,ox+x*TW,oy+y*TW);
  // static objects under actors
  for(const f of flowers){ if(f.x<x0||f.x>x1||f.y<y0||f.y>y1) continue; drawFlower(ox+f.x*TW,oy+f.y*TW,f.c); }
  drawStation(ox+42*TW,oy+36*TW);
  drawShrine(ox+57*TW,oy+34*TW);
  drawTorii(ox+54*TW,oy+37*TW);
  drawCastle(ox+10*TW,oy+15*TW);
  drawRetro(ox+50*TW,oy+15*TW);
  for(const s of stalls){ if(s.x<x0-2||s.x>x1) continue; drawYatai(ox+s.x*TW,oy+s.y*TW,stalls.indexOf(s)); }
  drawSchool(ox+24*TW,oy+8*TW);
  // actors sorted by y
  const actors=[];
  for(const tr of trees){ if(tr.x<x0-1||tr.x>x1+1||tr.y<y0-1||tr.y>y1+1) continue; actors.push({y:tr.y*TW+16,f:()=>drawTree(ox+tr.x*TW,oy+tr.y*TW,tr.rock)}); }
  for(const n of npcs) actors.push({y:n.y,f:()=>drawNPC(n.x+ox,n.y-14+oy,n,n.frame)});
  for(const d of decor) actors.push({y:d.y,f:()=>drawDecor(d.x+ox,d.y-14+oy,d.kind)});
  actors.push({y:player.y,f:()=>drawGirl(player.x+ox,player.y-14+oy,player.dir,player.frame)});
  actors.sort((a,b)=>a.y-b.y).forEach(a=>a.f());
  // school goal sparkle
  const gx=30*TW+ox, gy=13.5*TW+oy, n=qdone.filter(Boolean).length;
  if(n===4){ ctx.fillStyle="#ffd93d"; const s=Math.sin(performance.now()/250)*2;
    ctx.font="bold 12px monospace"; ctx.textAlign="center"; ctx.fillText("★",gx,gy-6+s); }
  // interact prompt
  if(state==="play"){ const n2=nearNPC();
    if(n2){ ctx.fillStyle="#fff"; ctx.font="bold 9px monospace"; ctx.textAlign="center";
      ctx.fillText("Z / Space",n2.x+ox,n2.y-24+oy); } }
}

/* ================= loop ================= */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,(ts-last)/1000||0); last=ts;
  if(state==="play"){
    elapsed+=dt;
    let dx=0,dy=0;
    if(keys["arrowup"]||keys["w"]) dy-=1;
    if(keys["arrowdown"]||keys["s"]) dy+=1;
    if(keys["arrowleft"]||keys["a"]) dx-=1;
    if(keys["arrowright"]||keys["d"]) dx+=1;
    if(dx&&dy){ dx*=0.707; dy*=0.707; }
    if(dx||dy){ tryMove(dx,dy); player.ft+=dt; if(player.ft>0.16){ player.ft=0; player.frame^=1; } }
    else player.moving=false;
    for(const n of npcs){ if(n.walk){ n.ft+=dt; if(n.ft>0.6){ n.ft=0; n.frame^=1; n.dir=(n.dir===2?3:2); n.x+=n.dir===2?-6:6; } } }
    // school gate goal
    if(qdone.every(Boolean)&&player.y<14.5*TW&&player.x>22*TW&&state==="play") gameOver();
    if(Math.floor(elapsed*2)!==Math.floor((elapsed-dt)*2)) updateHUD();
  }
  render();
}
resetGame();
showMenu();
requestAnimationFrame(loop);
</script>
